# PACC Forge 客户端模组的构建属性。
#
# MC 大版本矩阵：改 mcVersion 即切换，对应的版本参数从 gradle/versions/<mcVersion>.properties 读取。
# 目前维护 1.20.1 与 1.21.1 两套。CI 用 -PmcVersion=1.21.1 切到 1.21 分支构建。
mcVersion=1.20.1

# 与全仓库版本基准（ptv-backend/pom.xml）保持一致，由 scripts/bump-version.sh 同步。
modVersion=6.0.0
paccClientCoreVersion=6.0.0

org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
