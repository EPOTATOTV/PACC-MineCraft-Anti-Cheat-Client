# PACC Apollo 配置中心 —— detection.threshold 命名空间（检测与对抗判定阈值）
#
# 对应后端 pacc.detection.* / pacc.countermeasure.* / pacc.zero-day.*。
# 这些阈值直接决定误报与漏报，调整前请评估线上分布，灰度小步走。

# 综合风险评分红屏阈值与分级
pacc.detection.redscreen-threshold=85
pacc.detection.severe-threshold=95
pacc.detection.suspicious-low=70
pacc.detection.cooldown-minutes=10

# 硬件级作弊与完整性对抗判定阈值
pacc.countermeasure.input-macro-cv=0.06
pacc.countermeasure.hardware-match-score=70
pacc.countermeasure.integrity-suspect=25
pacc.countermeasure.integrity-tampered=60
pacc.countermeasure.environment-suspect=30
pacc.countermeasure.environment-high=60

# 零日外挂检测：三路异常信号融合权重与尺度
pacc.zero-day.iso-weight=0.5
pacc.zero-day.recon-weight=0.3
pacc.zero-day.baseline-weight=0.2
pacc.zero-day.recon-scale=1.2
pacc.zero-day.baseline-scale=3.0
