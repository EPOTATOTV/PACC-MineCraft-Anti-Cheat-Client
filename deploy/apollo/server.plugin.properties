# PACC Apollo 配置中心 —— server.plugin 命名空间（服务端插件沙箱与自动化）
#
# 对应后端 pacc.df.plugin.* / pacc.df.automation.*（DfProperties）。
# plugin-dir 是插件加载唯一允许的取件范围，改大它等于放宽沙箱入口面。

pacc.df.plugin.timeout-ms=200
pacc.df.plugin.max-cpu-ms-per-window=5000
pacc.df.plugin.max-output-bytes=16384
pacc.df.plugin.plugin-dir=plugins
pacc.df.automation.enabled=true
