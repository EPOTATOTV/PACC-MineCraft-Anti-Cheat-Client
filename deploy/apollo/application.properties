# PACC Apollo 配置中心 —— application 命名空间（默认命名空间 / 全局兜底）
#
# 本命名空间放最通用的功能开关，作为各业务命名空间的兜底默认值。
# 键名与后端 application.yml 的 pacc.* 一一对应；Apollo 里的值会覆盖本地默认。
# 注意：此处不放任何密钥，密钥一律走环境变量（fail-closed，见 StartupSecretGuard）。

# 检测规则引擎总开关与命中加分上限
pacc.rules.enabled=true
pacc.rules.max-bonus=15

# AI 推理服务（deploy/ai）
pacc.ai.enabled=false
pacc.ai.inference-url=http://ai:8000
