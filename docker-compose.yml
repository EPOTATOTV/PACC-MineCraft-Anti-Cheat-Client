# ============================================================
# PACC v5.0 PTV 系统编排（Docker Compose）
#
# 快速开始：
#   copy .env.example .env        # 按需修改密钥
#   docker compose up -d --build
#
# 访问：
#   管理后台前端 -> http://localhost:8081
#   后端 REST    -> http://localhost:8080
#   H2 控制台（仅内置 H2 模式）-> http://localhost:8080/h2-console
#
# 说明：
#   - MySQL 数据持久化于 volume pacc-mysql-data
#   - 后端/前端带健康检查与自动重启
#   - 生产环境请更换 .env 中所有密钥
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: pacc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pacc-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pacc}
      MYSQL_USER: ${MYSQL_USER:-pacc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pacc-secret}
    ports:
      - "${PACC_MYSQL_PORT:-3306}:3306"
    volumes:
      - pacc-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # R-01~R-07：多实例共享的限流账本 / 告警队列 / 热缓存 / 会话状态 / 分布式锁 / 实时指标。
  # 数据可丢（缓存与队列都有数据库兜底），但打开 AOF，重启后未消费的告警能继续投递。
  redis:
    image: redis:7-alpine
    container_name: pacc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pacc-redis-data:/data
    ports:
      - "${PACC_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ptv-backend:
    build:
      context: .
      dockerfile: ptv-backend/Dockerfile
    image: pacc/ptv-backend:5.4.0
    container_name: pacc-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pacc}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pacc}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pacc-secret}
      # 生产 fail-closed：以下密钥不再提供弱默认值，需在 .env 显式配置（缺失即启动失败）。
      PACC_SECURITY_ADMIN_API_KEY: ${PACC_ADMIN_API_KEY:-}
      PACC_SECURITY_SUPER_ADMIN_KEY: ${PACC_SECURITY_SUPER_ADMIN_KEY:-}
      PACC_SECURITY_JWT_SECRET: ${PACC_SECURITY_JWT_SECRET:-}
      PACC_SECURITY_WSS_SIGN_SECRET: ${PACC_SECURITY_WSS_SIGN_SECRET:-}
      PACC_MAIL_STUB_ENABLED: ${PACC_MAIL_STUB_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PACC_FEISHU_ENABLED: ${PACC_FEISHU_ENABLED:-false}
      PACC_FEISHU_APP_ID: ${PACC_FEISHU_APP_ID:-}
      PACC_FEISHU_APP_SECRET: ${PACC_FEISHU_APP_SECRET:-}
      PACC_FEISHU_SUPER_ADMIN_USERIDS: ${PACC_FEISHU_SUPER_ADMIN_USERIDS:-}
      PACC_FEISHU_ADMIN_USERIDS: ${PACC_FEISHU_ADMIN_USERIDS:-}
      PACC_MAIL_RESET_BASE_URL: ${PACC_MAIL_RESET_BASE_URL:-https://pacc.potatotv.asia}
      PACC_DETECTION_REDSCREEN_THRESHOLD: ${PACC_REDSCREEN_THRESHOLD:-85}
      # P-07 管理端告警渠道（飞书 / Discord 机器人 Webhook，留空即关闭）
      PACC_ALERT_WEBHOOK_ENABLED: ${PACC_ALERT_WEBHOOK_ENABLED:-true}
      PACC_ALERT_FEISHU_WEBHOOK: ${PACC_ALERT_FEISHU_WEBHOOK:-}
      PACC_ALERT_DISCORD_WEBHOOK: ${PACC_ALERT_DISCORD_WEBHOOK:-}
      PACC_ALERT_TRANSPARENCY_FEISHU_WEBHOOK: ${PACC_ALERT_TRANSPARENCY_FEISHU_WEBHOOK:-}
      PACC_ALERT_WEBHOOK_TIMEOUT_MS: ${PACC_ALERT_WEBHOOK_TIMEOUT_MS:-5000}
      # P-09 规则市场签名校验（公钥为 Base64 编码的 X.509 DER）
      PACC_RULES_REQUIRE_SIGNATURE: ${PACC_RULES_REQUIRE_SIGNATURE:-false}
      PACC_RULES_SIGNATURE_PUBKEY: ${PACC_RULES_SIGNATURE_PUBKEY:-}
      # R-01~R-07 Redis 专项：默认开启；置 false 时全部回退进程内实现。
      PACC_CLUSTER_REDIS_ENABLED: ${PACC_CLUSTER_REDIS_ENABLED:-true}
      PACC_CLUSTER_REDIS_HOST: redis
      PACC_CLUSTER_REDIS_PORT: "6379"
      PACC_CLUSTER_REDIS_AUTH: ${PACC_CLUSTER_REDIS_AUTH:-}
      PACC_CLUSTER_REDIS_POOL_SIZE: ${PACC_CLUSTER_REDIS_POOL_SIZE:-16}
      PACC_DETECTION_CACHE_TTL_SECONDS: ${PACC_DETECTION_CACHE_TTL_SECONDS:-300}
      PACC_SESSION_HEARTBEAT_INTERVAL_MS: ${PACC_SESSION_HEARTBEAT_INTERVAL_MS:-60000}
      PACC_ALERT_DISPATCH_MAX_ATTEMPTS: ${PACC_ALERT_DISPATCH_MAX_ATTEMPTS:-3}
      PACC_MOD_CHALLENGE_TTL_MS: ${PACC_MOD_CHALLENGE_TTL_MS:-60000}
      PACC_MOD_MAX_ELAPSED_MS: ${PACC_MOD_MAX_ELAPSED_MS:-5000}
      PACC_SEED: ${PACC_SEED:-false}
      TZ: Asia/Shanghai
    ports:
      - "${PACC_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  ptv-frontend:
    build:
      context: .
      dockerfile: ptv-frontend/Dockerfile
    image: pacc/ptv-frontend:5.4.0
    container_name: pacc-frontend
    restart: unless-stopped
    depends_on:
      ptv-backend:
        condition: service_healthy
    ports:
      - "${PACC_FRONTEND_PORT:-8081}:80"
    healthcheck:
      # nginx 仅监听 IPv4(0.0.0.0:80)，必须用 127.0.0.1 而非 localhost(会解析成 ::1 被拒)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- 域名网关（统一入口，推荐生产入口） ----------
  # admin.potatotv.asia -> 管理后台前端
  # api.potatotv.asia    -> 后端 REST / WSS
  # pacc.potatotv.asia   -> 玩家端长连接 + 玩家登录/注册
  # dl.potatotv.asia     -> PACC 客户端下载站
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
    image: pacc/gateway:5.4.0
    container_name: pacc-gateway
    restart: unless-stopped
    depends_on:
      ptv-frontend:
        condition: service_healthy
    ports:
      - "${PACC_GATEWAY_HTTP_PORT:-80}:80"
      - "${PACC_GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      # 放入 potatotv.asia.crt / potatotv.asia.key 后自动启用 HTTPS（见 deploy/gateway/certs/README.md）
      - ./deploy/gateway/certs:/etc/nginx/certs:ro

  # ---------- Go 边缘网关（API 网关 / WSS 入口，独立可替换 nginx /api 路由） ----------
  # 提供限流 + 管理鉴权 + Prometheus 指标；默认独立端口 8090，可与 nginx 并存或替换。
  gateway-go:
    build:
      context: deploy/gateway-go
      dockerfile: Dockerfile
    image: pacc/gateway-go:5.4.0
    container_name: pacc-gateway-go
    restart: unless-stopped
    depends_on:
      ptv-backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://ptv-backend:8080
      ADMIN_KEY: ${PACC_ADMIN_API_KEY:-}
      RATE_RPS: "20"
      RATE_BURST: "50"
    ports:
      - "${PACC_GO_GATEWAY_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ---------- AI 推理服务（FastAPI + NumPy；后端 PACC_AI_ENABLED=true 时按 15% 权重融合评分） ----------
  ai:
    build:
      context: deploy/ai
      dockerfile: Dockerfile
    image: pacc/ai:5.4.0
    container_name: pacc-ai
    restart: unless-stopped
    environment:
      PACC_AI_MODEL_PATH: /data/model.json
      TZ: Asia/Shanghai
    ports:
      - "${PACC_AI_PORT:-8000}:8000"
    volumes:
      - pacc-ai-model:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------- 监控栈（可选，--profile monitoring 启用） ----------
  #   docker compose --profile monitoring up -d
  #   Grafana: http://localhost:3000  (admin / ${GRAFANA_ADMIN_PASSWORD:-admin})
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: pacc-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./deploy/monitoring/prometheus:/etc/prometheus:ro
      - pacc-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PACC_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 20s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    container_name: pacc-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pacc-grafana-data:/var/lib/grafana
    ports:
      - "${PACC_GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  pacc-mysql-data:
  pacc-redis-data:
  pacc-ai-model:
  pacc-prometheus-data:
  pacc-grafana-data:
