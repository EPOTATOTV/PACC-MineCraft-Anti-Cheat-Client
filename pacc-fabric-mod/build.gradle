plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

// ---- MC 大版本矩阵：按 mcVersion 读取 gradle/versions/<mcVersion>.properties ----
def mcVersion = providers.gradleProperty('mcVersion').getOrElse('1.20.1')
def versionFile = file("gradle/versions/${mcVersion}.properties")
if (!versionFile.exists()) {
    throw new GradleException("不支持的 mcVersion=${mcVersion}，缺少 ${versionFile}")
}
def mc = new Properties()
versionFile.withInputStream { mc.load(it) }

def modVersionValue = providers.gradleProperty('modVersion').getOrElse('6.0.0')
def clientCoreVersion = providers.gradleProperty('paccClientCoreVersion').getOrElse('6.0.0')

version = "${modVersionValue}+mc${mcVersion}"
group = 'com.potatotv.pacc'
base.archivesName = 'pacc-fabric'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(mc.getProperty('java_version') as int)
    }
    withSourcesJar()
}

repositories {
    // pacc-client-core 由本仓库 Maven 构建后 install 到本地仓库（见 CI）。
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${mc.getProperty('minecraft_version')}"
    mappings "net.fabricmc:yarn:${mc.getProperty('yarn_mappings')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${mc.getProperty('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${mc.getProperty('fabric_api_version')}"

    // 客户端检测核心：与加载器无关的纯 Java 内核。include 让它随模组一起打进 jar。
    implementation "com.potatotv.pacc:pacc-client-core:${clientCoreVersion}"
    include "com.potatotv.pacc:pacc-client-core:${clientCoreVersion}"
}

// 把版本矩阵参数写进 fabric.mod.json / pacc.mixins.json，避免手改资源里的版本号。
processResources {
    def props = [
            version                : project.version,
            mod_id                 : 'pacc',
            loader_version         : mc.getProperty('loader_version'),
            minecraft_version_range: mc.getProperty('minecraft_version_range'),
            java_compatibility     : mc.getProperty('java_compatibility')
    ]
    inputs.properties props
    filesMatching(['fabric.mod.json', 'pacc.mixins.json']) {
        expand props
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Implementation-Title'  : 'PACC ClientGuard (Fabric)',
                'Implementation-Version': project.version
        ])
    }
}
